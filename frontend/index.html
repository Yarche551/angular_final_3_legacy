<!DOCTYPE html>

  <title>Интернет-магазин косметики - IZI BY IZI</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <style>
    html, body { background: #FBFBFB; margin: 0; }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #FBFBFB;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .35s ease;
    }
    #app-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e4e4e4;
      border-top-color: #55A265;
      border-radius: 50%;
      animation: app-loader-spin .7s linear infinite;
    }
    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>window.__iziLoadStart = Date.now();</script>
