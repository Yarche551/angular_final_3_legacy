<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Корзина - IZI BY IZI</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/jquery-ui.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/common-adaptive.css">
  <link rel="stylesheet" href="/css/cart.css">
  <link rel="stylesheet" href="/css/cart-adaptive.css">
</head>
<body>
<div id="app-header"></div>
<div id="app-second-header"></div>

<div id="cart-container-flower">
  <div id="cart-flower-bg"><img src="/images/cart-flower-bg.png" alt=""></div>
  <div id="cart">
    <div class="title-container">
      <div class="title-container-title">Товары</div>
      <div class="title-container-text">в вашей корзине</div>
    </div>
    <div id="cart-container">
      <div id="cart-block-gods"></div>
      <div id="cart-block-btn">
        <div id="cart-btn-img">
          <div id="cart-btn-img-border">
            <div id="cart-image-gift"></div>
            <div>Вместе с заказом Вы получите <span>комплимент</span> от нашего магазина</div>
          </div>
        </div>
        <div id="cart-container-btn">
          <div id="cart-container-btn-border">
            <div id="cart-btn-quantity">
              <div>Товаров в корзине:</div>
              <div id="cart-count-block">0</div>
            </div>
            <div id="cart-btn-price">
              <div>Итого:</div>
              <div id="cart-total-block"><span>0</span> руб.</div>
            </div>
            <a href="/order" class="gods-block-btn"><span>Оформить заказ</span></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="app-footer"></div>

<script src="/config.js"></script>
<script src="/js/jquery-3.4.1.min.js"></script>
<script src="/js/plugins/jQueryUI/jquery-ui.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
