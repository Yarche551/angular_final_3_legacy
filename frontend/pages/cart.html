<div id="app-second-header"></div>

<div id="cart-container-flower">
  <div id="cart-flower-bg"><img src="/images/cart-flower-bg.png" alt=""></div>
  <div id="cart">
    <div class="title-container">
      <div class="title-container-title">Товары</div>
      <div class="title-container-text">в вашей корзине</div>
    </div>
    <p id="cart-empty" class="page-message" hidden>В корзине пока нет товаров. <a href="/products">Перейти в каталог</a></p>
    <div id="cart-container" style="display: none">
      <div id="cart-block-gods"></div>
      <div id="cart-block-btn">
        <div id="cart-btn-img">
          <div id="cart-btn-img-border">
            <div id="cart-image-gift"></div>
            <div>Вместе с заказом Вы получите <span>комплимент</span> от нашего магазина</div>
          </div>
        </div>
        <div id="cart-container-btn">
          <div id="cart-container-btn-border">

              <div id="cart-count-block">0</div>
            </div>
            <div id="cart-btn-price">
              <div>Итого:</div>
              <div id="cart-total-block"><span>0</span> руб.</div>
            </div>
            <a href="/order" class="gods-block-btn"><span>Оформить заказ</span></a>
          </div>
        </div>
      </div>
    </div>

</div>
